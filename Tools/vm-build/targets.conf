# shellcheck shell=bash
#
# Build targets for the Vision Miner expansion-board firmware line. Sourced by
# build.sh.
#
# eclipse config | artifact base name | release artifacts | description
#
# "eclipse config" must match a <configuration name=...> in .cproject; it is also
# the directory the build writes into. "artifact base name" is what .cproject
# calls artifactName with ${ConfigName} expanded. "release artifacts" lists the
# extensions that ship.
#
# The artifact name is fixed by the board, not chosen here: to update an
# expansion board, the main board asks it for its board type and looks for
# Duet3Firmware_<board type>.bin in its firmware directory.
TARGETS=(
	"EXP3HC|Duet3Firmware_EXP3HC|bin|Duet 3 Expansion 3HC (SAME51)"
)

# Target used when a command is given none.
DEFAULT_TARGET="EXP3HC"
